# Full stack: Postgres, Redis, API, worker and the Caddy-served frontend.
#   docker compose up -d --build
# Database migrations run automatically when the api container starts.

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ai_debates}
  REDIS_URL: redis://redis:6379/0
  MEDIA_ROOT: /media

services:
  db:
    # Keep the major version: upgrading requires migrating the data (dump + restore or pg_upgrade).
    # Since 18 the image keeps the cluster in /var/lib/postgresql/<major>/docker and the volume
    # sits one level up.
    image: postgres:18-alpine
    restart: always
    volumes:
      - postgresql_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_debates}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_debates}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8-alpine
    restart: always
    # The redis:8 image declares no VOLUME: without this its RDB snapshot dies with the container.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ./backend
      target: api
    restart: always
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    env_file:
      - .env
    environment:
      <<: *backend-env
    volumes:
      - media_data:/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Debate turns (LLM streaming), then background jobs (trending topics, recovery checks) when
  # no turn waits. Several replicas, so one slow model or one busy user never stalls the others.
  worker:
    build:
      context: ./backend
      target: worker
    restart: always
    command: python -m app.worker --queues default,background
    deploy:
      replicas: ${TURN_WORKERS:-4}
    # A deploy lets the running turn finish (RQ's warm shutdown on SIGTERM); a turn answers
    # within LLM_TURN_TIMEOUT (5 min) plus its scenes. Runs that are cut anyway are recovered.
    stop_grace_period: 6m
    env_file:
      - .env
    environment:
      <<: *backend-env
      # One forked process per job: a job that hangs is killed without its worker.
      RQ_SIMPLE_WORKER: "false"
    volumes:
      - media_data:/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Audio builds (TTS + ffmpeg). Separate process so a long build never blocks debate turns.
  media-worker:
    build:
      context: ./backend
      target: worker
    restart: always
    command: python -m app.worker --queues media
    # Builds take minutes: one cut by a deploy is queued again and reuses its voiced turns.
    stop_grace_period: 1m
    env_file:
      - .env
    environment:
      <<: *backend-env
      RQ_SIMPLE_WORKER: "false"
    volumes:
      - media_data:/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Periodic jobs (RQ cron): enqueues the hourly trending-topics check; the worker runs it.
  scheduler:
    build:
      context: ./backend
      target: api
    restart: always
    command: python -m app.scheduler
    env_file:
      - .env
    environment:
      <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    container_name: ai-debates-frontend-1
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    restart: always
    ports:
      - "80:80"
    environment:
      # Plain HTTP; TLS is terminated by the external Caddy in production (see docker-compose.prod.yml)
      - DOMAIN_NAME=:80
    depends_on:
      - api

volumes:
  postgresql_data:
  redis_data:
  media_data:
