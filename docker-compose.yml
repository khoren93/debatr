# Full stack: Postgres, Redis, API, worker and the Caddy-served frontend.
#   docker compose up -d --build
# Database migrations run automatically when the api container starts.

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ai_debates}
  REDIS_URL: redis://redis:6379/0
  MEDIA_ROOT: /media
  # The server renderer: the AI covers take the debaters' logos from it (/og/logo.png).
  WEB_INTERNAL_URL: http://web:3000
  # From .env (or the shell): the admin console's host, also read by the frontend's Caddy.
  ADMIN_HOST: ${ADMIN_HOST:-}

services:
  db:
    # Keep the major version: upgrading requires migrating the data (dump + restore or pg_upgrade).
    # Since 18 the image keeps the cluster in /var/lib/postgresql/<major>/docker and the volume
    # sits one level up.
    image: postgres:18-alpine
    restart: always
    volumes:
      - postgresql_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_debates}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_debates}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8-alpine
    restart: always
    # The redis:8 image declares no VOLUME: without this its RDB snapshot dies with the container.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ./backend
      target: api
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: always
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    env_file:
      - .env
    environment:
      <<: *backend-env
    volumes:
      - media_data:/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Debate turns (LLM streaming), then background jobs (trending topics, recovery checks) when
  # no turn waits. Several replicas, so one slow model or one busy user never stalls the others.
  worker:
    build:
      context: ./backend
      target: worker
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: always
    command: python -m app.worker --queues default,background
    deploy:
      replicas: ${TURN_WORKERS:-4}
    # A deploy lets the running turn finish (RQ's warm shutdown on SIGTERM); a turn answers
    # within LLM_TURN_TIMEOUT (5 min) plus its scenes. Runs that are cut anyway are recovered.
    stop_grace_period: 6m
    env_file:
      - .env
    environment:
      <<: *backend-env
      # One forked process per job: a job that hangs is killed without its worker.
      RQ_SIMPLE_WORKER: "false"
    volumes:
      - media_data:/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Audio builds (TTS + ffmpeg). Separate process so a long build never blocks debate turns.
  media-worker:
    build:
      context: ./backend
      target: worker
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: always
    command: python -m app.worker --queues media
    # Builds take minutes: one cut by a deploy is queued again and reuses its voiced turns.
    stop_grace_period: 1m
    env_file:
      - .env
    environment:
      <<: *backend-env
      RQ_SIMPLE_WORKER: "false"
    volumes:
      - media_data:/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Periodic jobs (RQ cron): enqueues the hourly trending-topics check; the worker runs it.
  scheduler:
    build:
      context: ./backend
      target: api
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: always
    command: python -m app.scheduler
    env_file:
      - .env
    environment:
      <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The server renderer: the HTML of every page (React Router 8, react-router-serve on :3000).
  # Its loaders call the API over the internal network with the visitor's cookie.
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: web
      args:
        - VITE_API_URL=/api
    restart: always
    environment:
      - API_INTERNAL_URL=http://api:8000
      - SITE_URL=${SITE_URL:-http://localhost}
      - NODE_OPTIONS=--max-old-space-size=160
      # Link preview cards (/og/*): drawn once, kept here (pruned past OG_CACHE_MAX_MB).
      - OG_CACHE_DIR=/app/og-cache
      - OG_CACHE_MAX_MB=${OG_CACHE_MAX_MB:-256}
    volumes:
      - og_cache:/app/og-cache
    mem_limit: 256m
    depends_on:
      - api

  # Caddy: static files, the admin console, /api → api, every page → web.
  frontend:
    container_name: ai-debates-frontend-1
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: caddy
      args:
        - VITE_API_URL=/api
    restart: always
    ports:
      - "80:80"
    environment:
      # Plain HTTP; TLS is terminated by the external Caddy in production (see docker-compose.prod.yml)
      - DOMAIN_NAME=:80
      # Host of the admin console (frontend/Caddyfile), from .env like the API's ADMIN_HOST. Without
      # it (development) the API serves the console on the site's origin too, and so does Caddy:
      # ADMIN_ON_SITE is "off" once ADMIN_HOST is set.
      - ADMIN_HOST=${ADMIN_HOST:-admin.localhost}
      - ADMIN_ON_SITE=${ADMIN_HOST:+off}
    depends_on:
      - api
      - web

volumes:
  postgresql_data:
  redis_data:
  media_data:
  og_cache:
