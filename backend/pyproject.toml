[project]
name = "ai-debates-backend"
version = "1.2.0"
description = "AI Debates API and worker: orchestrates LLM debates via OpenRouter"
readme = "../README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.143.5",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "redis>=8.1.0",
    "rq>=2.12.0",
    "httpx>=0.28.1",
    "sse-starlette>=3.5.0",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.32",
    "greenlet>=3.5.6",
    "edge-tts>=7.3.1",
    "bcrypt>=5.0.0",
    "stripe>=16.0.0",
    "cryptography>=50.0.2",
    "feedparser>=6.0.14",
    "pyotp>=2.10.0",
    "segno>=1.6.6",
    "webauthn>=3.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
    "pyright>=1.1.414",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # FastAPI Depends() in defaults
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pyright]
include = ["app", "tests", "migrations/env.py"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportUnknownMemberType = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:app.*"]
