[project]
name = "debatr"
dynamic = ["version"]
description = "Run AI debates from your terminal and give AI agents a debate tool (MCP): the command-line client for Debatr."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Khoren Markosyan" }]
keywords = ["ai", "llm", "debate", "openrouter", "mcp", "cli", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1,<1",
    "typer>=0.27,<1",
    "rich>=14",
    "mcp>=2.3,<3",
]

[project.urls]
Homepage = "https://debatr.tv"
Documentation = "https://github.com/khoren93/debatr/tree/main/cli#readme"
Repository = "https://github.com/khoren93/debatr"
Issues = "https://github.com/khoren93/debatr/issues"
Changelog = "https://github.com/khoren93/debatr/blob/main/CHANGELOG.md"

[project.scripts]
debatr = "debatr.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/debatr/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src/debatr", "tests", "README.md", "LICENSE"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
    "pyright>=1.1.414",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
ignore = [
    "E501", # line length handled by the formatter
    "B008", # typer.Option() in defaults
]

[tool.ruff.lint.isort]
known-first-party = ["debatr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
