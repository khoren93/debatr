name: Release CLI

# Publishes the `debatr` package (cli/) to PyPI when a tag like `cli-v0.1.0` is pushed.
# One-time setup: on PyPI add a trusted publisher for this repository, workflow
# `cli-release.yml` and environment `pypi` (no API token is stored anywhere).

on:
  push:
    tags: ["cli-v*"]

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: cli/uv.lock
      - run: uv sync --frozen
      - name: The tag matches the package version
        run: |
          version="$(uv run python -c 'import debatr; print(debatr.__version__)')"
          test "cli-v${version}" = "${GITHUB_REF_NAME}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match version ${version} in src/debatr/__init__.py"
            exit 1
          }
      - run: uv run ruff check . && uv run pyright && uv run pytest -q
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: cli/dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/debatr/
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
